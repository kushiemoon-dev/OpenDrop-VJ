name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-native-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-windows:
    name: Test Suite (Windows)
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Same dependency setup and cache keys as release.yml's windows-portable
      # job, so both workflows share the cached vcpkg tree.
      - name: Cache vcpkg installed packages
        id: cache-vcpkg-projectm
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-projectm-4.1.6-angle-2026-10-windows

      - name: Install vcpkg dependencies (pinned projectM, ANGLE)
        if: steps.cache-vcpkg-projectm.outputs.cache-hit != 'true'
        run: |
          vcpkg install projectm:x64-windows --overlay-ports=packaging/windows/overlay-ports
          if ($LASTEXITCODE -ne 0) { exit 1 }
          vcpkg install angle:x64-windows zlib:x64-windows --overlay-ports=packaging/windows/overlay-ports

      - name: Add vcpkg runtime DLLs to PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\vcpkg\installed\x64-windows\bin"

      - name: cargo build
        run: cargo build --workspace

      # The headless GL tests (`gl_tests`) need a working OpenGL ES context,
      # which GitHub's GPU-less Windows runners cannot provide through ANGLE
      # (context creation is lost or shaders fail to compile). They run on
      # the Linux job instead.
      - name: cargo test
        run: cargo test --workspace --no-fail-fast -- --skip gl_tests

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
