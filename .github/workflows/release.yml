name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-artifacts
          - os: windows-latest
            artifact: windows-artifacts
          - os: macos-latest
            artifact: mac-artifacts

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm rebuild electron esbuild core-js electron-winstaller audify || true

      - name: Download megapack presets
        shell: bash
        run: |
          curl -L https://github.com/kushiemoon-dev/OpenDrop-VJ/releases/download/megapack-v1/presets-megapack.tar.gz \
            | tar xz -C static/

      - name: Download video loops megapack (optional)
        shell: bash
        run: |
          curl -fL https://github.com/kushiemoon-dev/OpenDrop-VJ/releases/download/video-megapack-v1/video-megapack.tar.gz \
            | tar xz -C static/ || true

      - name: Build SPA
        run: pnpm build
        env:
          PUBLIC_VIDEO_CDN: ''
          PUBLIC_CLOUD_PRESETS_API: ''

      - name: Rebuild native modules for Electron
        run: pnpm exec electron-rebuild -f -w grandiose || true

      - name: Rebuild Spout addon (Windows only)
        if: matrix.os == 'windows-latest'
        run: pnpm exec electron-rebuild -f -w spout-addon || true

      - name: Package Electron app
        run: pnpm exec electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.exe
            dist-electron/*.dmg
          if-no-files-found: warn

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/*.dmg
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
