[package]
name = "opendrop-app"
version = "0.1.0"
edition = "2021"

[dependencies]
opendrop-core = { path = "../core" }
opendrop-engine = { path = "../engine" }
opendrop-audio = { path = "../audio" }
opendrop-io = { path = "../io" }
# `serde`: `winit::keyboard::Key` derives `Serialize`/`Deserialize` only
# behind this feature: needed by `app::keymap`'s `ui.json` persistence
# (Step 3 of the Phase 8 VJ-panels plan). See that module's doc comment for
# why a `Key`-as-JSON-object-key still isn't the actual on-disk shape.
winit = { version = "0.30.13", features = ["serde"] }
glutin = "0.32.3"
glutin-winit = "0.5.0"
glow = "0.17"
raw-window-handle = "0.6"
egui = "0.36.1"
egui_glow = { version = "0.36.1", features = ["winit"] }
khronos-egl = { version = "6", features = ["dynamic"] }
directories = "6"
# Native file dialog (`ui::cloud_presets`'s Upload button): absent from
# the workspace before this step, confirmed. Linux backend needs GTK or
# xdg-desktop-portal at build/runtime; see the root README if that's
# unavailable in a given environment.
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
# Ableton Link support (`ui::link` panel + `AppState`'s Link wiring). OFF
# by default: activates `opendrop-io`'s own `link` feature, which pulls
# in the GPL-2.0-or-later `rusty_link` crate. See the root README's
# "Ableton Link (optional, GPL)" section before enabling this in any
# binary you package/distribute.
link = ["opendrop-io/link"]
