[package]
name = "opendrop-io"
version = "0.1.0"
edition = "2021"

[dependencies]
arc-swap = "1.9"
axum = { version = "0.8", features = ["ws"] }
directories = "6"
# Kick chat's Pusher WebSocket (`io::kick`): read/write on `WebSocketStream`,
# TLS backend matched to `reqwest`'s below (native-tls) so only one TLS
# stack is pulled into the dependency tree.
futures-util = "0.3"
grafton-ndi = { version = "1.0.0", default-features = false }
keyring = "4"
local-ip-address = "0.6"
midir = "0.11"
obws = "0.15"
opendrop-core = { path = "../core" }
rand = "0.10.2"
# Kick chatroom-id discovery HTTP call (`io::kick`): default features
# include `default-tls` (native-tls), `json` added for the discovery
# response's `.json::<T>()` deserialization.
reqwest = { version = "0.12", features = ["json"] }
rosc = "0.11.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }
# Kick chat's Pusher WebSocket connection (`io::kick`): `native-tls` to
# match `reqwest`'s TLS backend above.
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tower-http = { version = "0.7", features = ["fs"] }
# Twitch IRC chat client (`io::twitch`): purpose-built for Twitch's
# auth/rate-limit behavior, chosen over the generic `irc` crate (brief in
# PHASE5-IO.PLAN's Task 17 découpage note).
twitch-irc = "6.1"

[dev-dependencies]
# Sync WS client used only by remote_ws's real-server smoke test: same
# version already pulled in transitively via axum/tokio-tungstenite, so
# this doesn't add a new version to resolve.
tungstenite = "0.29"
