packages:
  - '.'

allowBuilds:
  audify: true
  core-js: true
  electron: true
  esbuild: true
  electron-winstaller: true
  grandiose: true
  spout-addon: true
  '@ktamas77/abletonlink': true
  # false: postinstall only downloads a Chromium binary for kick-js's username/password
  # browser-login path, which Task 10 doesn't use (bearer-token + cookies + xsrf path only).
  puppeteer: false

overrides:
  shell-quote: '>=1.9.0'
  tar: '>=7.5.18'
  esbuild: '>=0.28.1'
  cookie: '>=0.7.0'
  undici: '>=7.29.0 <8.0.0'
  axios: '>=1.18.0'
  ip-address: '>=10.3.1'
  js-yaml: '>=4.3.1 <5.0.0'

patchedDependencies:
  grandiose@0.0.4: patches/grandiose@0.0.4.patch
  '@ktamas77/abletonlink@1.2.3': patches/@ktamas77+abletonlink@1.2.3.patch
